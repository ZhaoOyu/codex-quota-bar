[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-quota-bar"
version = "0.1.1"
description = "Codex five-hour and weekly quota in your macOS or Ubuntu menu bar"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["rumps==0.4.0; sys_platform == 'darwin'"]

[project.scripts]
codex-quota-bar = "codex_quota_bar.__main__:main"

[tool.setuptools.packages.find]
include = ["codex_quota_bar*"]

